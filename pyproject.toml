[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-triage"
version = "0.1.0"
description = "Confidence-gated log and alert triage for sysadmins, powered by TypeSafe Jev (System One model)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kerem Işık" }]
dependencies = [
    "typesafe-sdk>=0.7,<0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
research = ["numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy>=1.26", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
jev-triage = "jev_triage.main:run"
jev-eval = "research.eval.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_triage", "research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

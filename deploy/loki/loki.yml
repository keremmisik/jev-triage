# Single-binary Loki for local demos. Not a production configuration.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 72h

# LogQL alerting rules -> Alertmanager -> jev-triage webhook.
# With auth disabled the tenant is "fake", hence rules/fake/*.yml.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  evaluation_interval: 30s
  enable_api: true
  enable_alertmanager_v2: true
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
